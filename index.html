<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Eventos - Capoeira</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #333; }
        .secao { margin-bottom: 30px; }
        .titulo-secao { border-bottom: 2px solid #ff9900; padding-bottom: 5px; color: #ff9900; }
        .grid-flyers { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 15px; }
        .card { background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card img { max-width: 100%; border-radius: 4px; height: 300px; object-fit: cover; }
        .data-evento { font-weight: bold; color: #666; margin-top: 10px; }
        .busca-container { text-align: center; margin: 20px 0; }
        input[type="date"] { padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="container">
    <h1>Mural de Eventos de Capoeira 🤸‍♂️</h1>

    <!-- 1. BUSCA POR CALENDÁRIO -->
    <div class="busca-container">
        <label for="calendario">Buscar eventos futuros por data: </label>
        <input type="date" id="calendario" onchange="buscarPorData()">
    </div>

    <!-- 2. FINAL DE SEMANA ATUAL / PRÓXIMOS DESTAQUES -->
    <div class="secao" id="secao-proximos">
        <h2 class="titulo-secao">Próximos Eventos (Esta Semana)</h2>
        <div class="grid-flyers" id="flyers-proximos">
            <!-- Inseridos dinamicamente via JS -->
            <div class="card">
                <img src="https://via.placeholder.com/250x300" alt="Flyer">
                <div class="data-evento">11/07/2026</div>
                <p>Vadiagem na Praça</p>
            </div>
        </div>
    </div>

    <!-- 3. CALENDÁRIO COMPLETO DO MÊS -->
    <div class="secao" id="secao-mes">
        <h2 class="titulo-secao">Eventos do Mês</h2>
        <div class="grid-flyers" id="flyers-mes">
            <!-- Inseridos dinamicamente via JS -->
        </div>
    </div>
</div>

    }
</script>
</body>
</html>
