<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Eventos – Capoeira</title>

    <!-- ---------- ESTILOS ---------- -->
    <style>
        :root{
            --primary:#e67e22;
            --primary-dark:#d35400;
            --bg:#f4f4f9;
            --card-bg:#fff;
            --text:#333;
            --subtle:#7f8c8d;
            --quickview-bg:#fff;
            --qv-shadow:0 6px 20px rgba(0,0,0,.25);
        }

        /* Reset */
        *{box-sizing:border-box;margin:0;padding:0}

        body{
            font-family:"Segoe UI",Arial,sans-serif;
            background:var(--bg);
            padding:20px;
            color:var(--text);
        }

        .container{
            max-width:1000px;
            margin:0 auto;
        }

        h1{
            text-align:center;
            color:#222;
            margin-bottom:1.5rem;
        }

        /* ---------- Filtros ---------- */
        .busca-container{
            display:flex;
            flex-wrap:wrap;
            gap:15px;
            justify-content:center;
            background:#fff;
            padding:15px;
            border-radius:8px;
            box-shadow:0 2px 4px rgba(0,0,0,.05);
            margin:25px 0;
        }
        .busca-container label{
            display:flex;
            flex-direction:column;
            font-weight:600;
        }
        .busca-container select,
        .busca-container input[type="date"]{
            padding:8px 10px;
            border:1px solid #ccc;
            border-radius:4px;
            font-size:16px;
            min-width:160px;
        }

        /* ---------- Layout das seções ---------- */
        .secao{margin-bottom:40px;}
        .titulo-secao{
            border-bottom:3px solid var(--primary);
            padding-bottom:5px;
            color:var(--primary);
            font-size:24px;
            margin-top:0;
        }

        /* Agrupamento por mês (dentro de “Outros Eventos Futuros”) */
        .mes-secao{margin-top:30px;}
        .titulo-mes{
            border-bottom:2px solid #3498db;
            padding-bottom:5px;
            color:#2c3e50;
            font-size:20px;
            margin:0;
        }

        /* ---------- Grade de cards – responsiva ---------- */
        .grid-flyers{
            display:grid;
            grid-template-columns:1fr;          /* celular – 1 por linha */
            gap:20px;
            margin-top:15px;
        }

        /* Tablets de tamanhos médios → 2 colunas */
        @media(min-width:600px){
            .grid-flyers{grid-template-columns:repeat(2,1fr);}
        }

        /* Desktops → 3 colunas */
        @media(min-width:900px){
            .grid-flyers{grid-template-columns:repeat(3,1fr);}
        }

        .card{
            background:var(--card-bg);
            border-radius:8px;
            padding:15px;
            box-shadow:0 4px 8px rgba(0,0,0,.08);
            text-align:center;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            cursor:pointer;
            transition:transform .2s,box-shadow .2s;
        }
        .card:hover{
            transform:translateY(-3px);
            box-shadow:0 6px 12px rgba(0,0,0,.12);
        }
        .card img{
            max-width:100%;
            border-radius:6px;
            height:320px;
            object-fit:cover;
            background:#eee;
            display:block;
            margin-bottom:10px;
        }
        .nome-evento{
            font-weight:bold;
            font-size:18px;
            margin:0 0 5px;
            color:#2c3e50;
        }
        .data-evento{
            font-weight:bold;
            color:var(--subtle);
            font-size:14px;
            margin-bottom:10px;
        }

        /* Ações do cartão (botão de adicionar ao calendário) */
        .card-acoes{
            display:flex;
            gap:8px;
            margin-top:8px;
        }
        .btn-calendario{
            flex:1;
            background:#2c3e50;
            color:#fff;
            text-decoration:none;
            padding:6px 0;
            border-radius:4px;
            font-size:13px;
            font-weight:600;
            cursor:pointer;
            transition:background .2s;
            text-align:center;
        }
        .btn-calendario:hover{
            background:#34495e;
        }

        /* ---------- Pop‑up de visualização (apenas imagem) ---------- */
        .quickview{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.5);
            display:none;               /* oculto por padrão */
            align-items:center;
            justify-content:center;
            z-index:1000;
            padding:20px;
        }
        .quickview.active{
            display:flex;
        }
        .quickview .qv-content{
            background:var(--quickview-bg);
            border-radius:8px;
            max-width:90vw;
            max-height:90vh;
            width:auto;
            text-align:center;
            box-shadow:var(--qv-shadow);
            position:relative;
            padding:15px;
        }
        .quickview .qv-content img{
            max-width:100%;
            max-height:80vh;
            border-radius:6px;
            display:block;
            margin:0 auto;
        }
        .quickview .qv-close{
            position:absolute;
            top:10px;
            right:12px;
            font-size:26px;
            font-weight:bold;
            color:#555;
            cursor:pointer;
            line-height:1;
        }
        .quickview .qv-close:hover{
            color:#000;
        }

        /* ---------- Light‑box original (mantido por compatibilidade) ---------- */
        .lightbox{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.85);
            align-items:center;
            justify-content:center;
            z-index:1000;
        }
        .lightbox.active{
            display:flex;
        }
        .lightbox img{
            max-width:90vw;
            max-height:90vh;
            border-radius:8px;
            box-shadow:0 0 20px rgba(255,255,255,.2);
        }
        .lightbox .close{
            position:absolute;
            top:20px;
            right:25px;
            color:#fff;
            font-size:36px;
            font-weight:bold;
            cursor:pointer;
        }
        .lightbox .close:hover{
            opacity:.7;
        }

        /* ---------- Mensagem de carregamento ---------- */
        .loading{
            text-align:center;
            font-size:18px;
            color:#666;
            margin:30px 0;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Mural de Eventos de Capoeira 🤸‍♂️</h1>

    <!-- ---------- Filtros ---------- -->
    <div class="busca-container">
        <label>
            <strong>Buscar por data:</strong>
            <input type="date" id="calendario" onchange="aplicarFiltros()">
        </label>
        <label>
            <strong>Filtrar por mês:</strong>
            <select id="filtro-mes" onchange="aplicarFiltros()">
                <option value="">Todos os meses</option>
            </select>
        </label>
    </div>

    <div id="loading" class="loading">Carregando eventos locais…</div>

    <!-- ---------- Próximos eventos (sexta-feira a domingo + quaisquer eventos entre hoje e o próximo domingo) ---------- -->
    <div class="secao" id="secao-fds" style="display:none;">
        <h2 class="titulo-secao">Próximos Eventos – Este Final de Semana</h2>
        <div class="grid-flyers" id="flyers-fds"></div>
    </div>

    <!-- ---------- Outros eventos futuros (após o próximo domingo) ---------- -->
    <div class="secao" id="secao-futuros" style="display:none;">
        <h2 class="titulo-secao">Outros Eventos Futuros</h2>
        <div id="flyers-futuros"></div>
    </div>
</div>

<!-- Pop‑up de visualização de imagem (apenas imagem) -->
<div id="quickview" class="quickview" onclick="fecharQuickview()">
    <div class="qv-content" onclick="event.stopPropagation()">
        <span class="qv-close" title="Fechar">&times;</span>
        <img id="qv-img" src="" alt="Visualização maior">
    </div>
</div>

<!-- Light‑box original (mantido por compatibilidade) -->
<div id="lightbox" class="lightbox" onclick="fecharLightbox()">
    <span class="close" title="Fechar">&times;</span>
    <img id="lightbox-img" src="" alt="Flyer em tamanho completo">
</div>

<script>
/* -----------------------------------------------------------------
   CONFIGURAÇÃO E DADOS
----------------------------------------------------------------- */
const URL_CSV = "eventos.csv"; // arquivo CSV local (mesmo diretório)
let todosOsEventos = [];

/* Lê o CSV, armazena objetos de eventos (somente datas futuras),
   pré-popula o filtro de mês e inicia o render.
   (Ignora linhas malformadas e um cabeçalho opcional "Data") */
async function carregarDadosDoCSV() {
    try {
        const resp = await fetch(URL_CSV);
        if (!resp.ok) throw new Error("CSV fetch failed");
        const txt = await resp.text();

        const rows = txt.split("\n");
        const headerOk = rows[0].includes("Data");
        const dataRows = headerOk ? rows.slice(1) : rows;
        const hoje = new Date();
        hoje.setHours(0,0,0,0);

        dataRows.forEach(r => {
            if (!r.trim()) return;
            const [dataStr, nome, link] = r.split(",");
            if (!dataStr || !nome || !link) return;

            const [dia, mes, ano] = dataStr.trim().split("/");
            const dataEvento = new Date(ano, mes - 1, dia);
            if (dataEvento < hoje) return;

            todosOsEventos.push({
                dataStr: dataStr.trim(),
                dataObjeto: dataEvento,
                nome: nome.trim(),
                link: link.trim()
            });
        });

        // ordena do mais próximo para o mais distante
        todosOsEventos.sort((a,b) => a.dataObjeto - b.dataObjeto);
        popularcharOptionsMes();
        aplicarFiltros();
    } catch (e) {
        document.getElementById("loading").innerText =
            "Erro ao carregar o arquivo eventos.csv do repositório.";
        console.error(e);
    }
}

/* Popula o <select> de filtro de mês com meses únicos (YYYY‑MM)
   ordenados do mais recente para o mais antigo. */
function popularcharOptionsMes() {
    const sel = document.getElementById("filtro-mes");
    const meses = new Set();

    todosOsEventos.forEach(ev => {
        const yyyy = ev.dataObjeto.getFullYear();
        const mm = String(ev.dataObjeto.getMonth() + 1).padStart(2, "0");
        meses.add(`${yyyy}-${mm}`);
    });

    const arr = Array.from(meses).sort().reverse(); // mais recente primeiro
    sel.innerHTML = `<option value="">Todos os meses</option>` +
        arr.map(chave => {
            const [ano, mes] = chave.split("-");
            const d = new Date(ano, mes - 1, 1);
            const nomeMes = d.toLocaleString("pt-BR", { month: "long" });
            return `<option value="${chave}">${nomeMes} ${ano}</option>`;
        })
        .join("");
}

/* -----------------------------------------------------------------
   LÓGICA DE FILTRAGEM (filtro de data única + filtro de mês)
----------------------------------------------------------------- */
function aplicarFiltros() {
    const dataInput = document.getElementById("calendario").value; // YYYY‑MM‑DD
    const mesSel = document.getElementById("filtro-mes").value;   // YYYY‑MM

    let filtrados = todosOsEventos;

    // filtro de data única (exata)
    if (dataInput) {
        const [ano, mes, dia] = dataInput.split("-");
        const dataBuscada = new Date(ano, mes - 1, dia);
        filtrados = filtrados.filter(ev =>
            ev.dataObjeto.getTime() === dataBuscada.getTime()
        );
    }

    // filtro de mês
    if (mesSel) {
        const [ano, mes] = mesSel.split("-");
        const inicio = new Date(ano, mes - 1, 1);
        const fim = new Date(ano, mes - 1, 31, 23, 59, 59, 999);
        filtrados = filtrados.filter(ev =>
            ev.dataObjeto.getTime() >= inicio.getTime() &&
            ev.dataObjeto.getTime() <= fim.getTime()
        );
    }

    renderizarPainel(filtrados);
}

/* -----------------------------------------------------------------
   RENDERIZAÇÃO ----------------------------------------------------------------- */
function renderizarPainel(eventos) {
    const hoje = new Date();
    hoje.setHours(0,0,0,0);

    // O próximo domingo (inclusive) após hoje — este é o limite para o bloco "Próximos eventos"
    const nextSunday = new Date(hoje);
    const dayDiff = (7 - hoje.getDay()) % 7; // 0 => domingo, dias até o domingo
    nextSunday.setDate(hoje.getDate() + dayDiff);

    const fdsContainer = document.getElementById("flyers-fds");
    const futurosContainer = document.getElementById("flyers-futuros");

    fdsContainer.innerHTML = "";
    futurosContainer.innerHTML = "";

    let temFds = false;
    const futurosPorMes = {};

    eventos.forEach(ev => {
        /* HTML do cartão – inclui o botão "Adicionar ao calendário" */
        const cardHTML = `
            <div class="card" data-idx="${todosOsEventos.indexOf(ev)}">
                <img src="${ev.link}" alt="Flyer" onerror="this.src='https://via.placeholder.com/280x320?text=Sem+Imagem'">
                <div class="nome-evento">${ev.nome}</div>
                <div class="data-evento">📅 ${ev.dataStr}</div>
                <div class="card-acoes">
                    <a href="#" class="btn-calendario"
                       onclick="event.stopPropagation(); mostrarModalAdicionarAoCalendario(
                           '${ev.nome.replace(/'/g,"&#x27;")}',
                           '${ev.dataStr}',
                           event
                       )">
                        Adicionar ao calendário
                    </a>
                </div>
            </div>`;

        if (ev.dataObjeto.getTime() >= hoje.getTime() && ev.dataObjeto.getTime() <= nextSunday.getTime()) {
            // ----- Dentro do próximo domingo → bloco “Próximos eventos” -----
            fdsContainer.innerHTML += cardHTML;
            temFds = true;
        } else {
            // ----- Após a próxima semana → “Outros Eventos Futuros” -----
            const chaveMes = ev.dataObjeto.getFullYear() + "-" +
                             String(ev.dataObjeto.getMonth() + 1).padStart(2, "0");
            if (!futurosPorMes[chaveMes]) futurosPorMes[chaveMes] = [];
            futurosPorMes[chaveMes].push(cardHTML);
        }
    });

    // Mostra/oculta o bloco “Próximos eventos”
    document.getElementById("secao-fds").style.display = temFds ? "block" : "none";

    // Constrói o “Outros Eventos Futuros” agrupado por mês
    if (Object.keys(futurosPorMes).length) {
        Object.keys(futurosPorMes).sort().forEach(chave => {
            const [ano, mes] = chave.split("-");
            const d = new Date(ano, mes - 1, 1);
            const tituloMes = d.toLocaleString("pt-BR", { month: "long", year: "numeric" });

            const div = document.createElement("div");
            div.className = "mes-secao";
            div.innerHTML = `<h3 class="titulo-mes">${tituloMes}</h3>${futurosPorMes[chave].join("")}`;
            futurosContainer.appendChild(div);
        });
    }
    document.getElementById("secao-futuros").style.display = Object.keys(futurosPorMes).length ? "block" : "none";

    // Esconde o indicador de carregamento
    document.getElementById("loading").style.display = "none";
}

/* -----------------------------------------------------------------
   POP‑UP DE VISUALIZAÇÃO (imagem maior apenas) – abre no clique do cartão
----------------------------------------------------------------- */
function abrirQuickview(idx) {
    const ev = todosOsEventos[idx];
    if (!ev) return;
    document.getElementById("qv-img").src = ev.link;
    document.getElementById("quickview").classList.add("active");
}
function fecharQuickview() {
    document.getElementById("quickview").classList.remove("active");
    document.getElementById("qv-img").src = ""; // interrompe o carregamento
}

/* O manipulador de evento (manual e total) abre a visualização maior */
document.addEventListener("click", e => {
    const card = e.target.closest(".card");
    if (card) {
        const idx = Number(card.getAttribute("data-idx"));
        abrirQuickview(idx);
    }

    // Fecha a visualização quando o usuário clica no botão de fechar no pop‑up
    if (e.target.closest(".qv-close")) {
        fecharQuickview();
    }
});

/* Fecha o pop‑up com a tecla ESC */
document.addEventListener("keydown", e => {
    if (e.key === "Escape") fecharQuickview();
});

/* -----------------------------------------------------------------
   MODAL DE "Adicionar ao calendário" (iOS/Apple, Android/Google, .ics)
----------------------------------------------------------------- */
function mostrarModalAdicionarAoCalendario(titulo, dataStr, evtOriginal) {
    evtOriginal.preventDefault(); // impede que o clique se propague

    const [dia, mes, ano] = dataStr.split("/");
    const dataCal = `${ano}${mes.padStart(2,"0")}${dia.padStart(2,"0")}`; // para deep links (iOS/Android)
    const dataCalFormatada = `${ano}-${mes.padStart(2,"0")}-${dia.padStart(2,"0")}`; // YYYY‑MM‑DD para Google

    // URL de link profundo iOS (Apple Calendar)
    const iosUrl = `calendarevent://?title=${encodeURIComponent(titulo)}&` +
                   `dates=${dataCal}/${dataCal}&` +
                   `location=&description=Evento%20do%20Mural%20de%20Capoeira`;

    // URL do Google Calendar (abre nativamente no Android, ou no navegador)
    const googleUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(titulo)}&dates=${dataCalFormatada}/${dataCalFormatada}&details=${encodeURIComponent("Evento do Mural de Capoeira")}&location=Online`;

    // Gera um pequeno bloco .ics para download em qualquer plataforma
    const icsContent = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Mural de Capoeira//Evento Único//PT",
        "BEGIN:VEVENT",
        `UID:${Date.now()}@muralcapoeira.com`,
        `DTSTART;VALUE=DATE:${dataCal}`,
        `DTEND;VALUE=DATE:${dataCal}`,
        `SUMMARY:${titulo}`,
        "END:VEVENT",
        "END:VCALENDAR"
    ].join("\r\n");
    const icsBase64 = encodeURIComponent(icsContent);

    /* Constrói o modal dentro do quickview (reutilizamos o elemento) */
    const qv = document.getElementById("quickview");
    qv.innerHTML = `
        <div class="qv-content" onclick="event.stopPropagation()">
            <span class="qv-close" title="Fechar">&times;</span>
            <h3 style="margin-top:0">Adicionar “${titulo}” ao calendário</h3>
            <p style="margin-bottom:10px">Escolha seu app de calendário:</p>
            <div style="display:flex;flex-direction:column;gap:10px">
                <a class="btn-calendario" href="${iosUrl}">
                    Apple Calendar (iOS)
                </a>
                <a class="btn-calendario" href="${googleUrl}" target="_blank">
                    Google/Calendar (Android)
                </a>
                <a class="btn-calendario" href="#" onclick="event.stopPropagation();gerarDownloadICS('${icsBase64}');return false;">
                    Baixar .ics (qualquer plataforma)
                </a>
                <a class="btn-calendario" href="https://support.apple.com/pt-br/guide/calendar/ifl1035/mac" target="_blank">
                    Como adicionar evento no Apple Calendar
                </a>
            </div>
        </div>
    `;
    qv.classList.add("active");

    // Fecha o modal quando o botão de fechar é clicado
    qv.querySelector(".qv-close").onclick = () => fecharQuickview();
}

/* Baixa um arquivo .ics na máquina do usuário */
function gerarDownloadICS(icsBase64) {
    const dec = decodeURIComponent(icsBase64);
    const blob = new Blob([dec], {type:"text/calendar;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `evento-${Date.now()}.ics`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    fecharQuickview();
}

/* -----------------------------------------------------------------
   Light‑box original (mantido por compatibilidade) – mesma api
----------------------------------------------------------------- */
function abrirLightbox(src){document.getElementById("lightbox-img").src=src;document.getElementById("lightbox").classList.add("active");}
function fecharLightbox(){document.getElementById("lightbox").classList.remove("active");}

/* Fecha o light‑box original com Esc */
document.addEventListener("keydown",e=>{if(e.key==="Escape\" && document.getElementById("lightbox").classList.contains("active\"))fecharLightbox();});

/* -----------------------------------------------------------------
   Inicializa tudo
----------------------------------------------------------------- */
carregarDadosDoCSV();
</script>

</body>
</html>
