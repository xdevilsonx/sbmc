<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Eventos – Capoeira</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- ---------- ESTILOS ---------- -->
    <style>
        :root{
            --bg:#FAF3E4;
            --bg-alt:#F3E9D4;
            --ink:#20241F;
            --subtle:#6B6357;
            --teal:#0C5C56;
            --teal-dark:#083F3B;
            --mustard:#F0A202;
            --terracotta:#D8572A;
            --card-bg:#FFFFFF;
            --line:#E3D6BC;
            --shadow:0 10px 24px rgba(32,36,31,.08);
            --shadow-hover:0 16px 32px rgba(32,36,31,.14);
        }

        *{box-sizing:border-box;margin:0;padding:0}

        body{
            font-family:"Inter",Arial,sans-serif;
            background:
                radial-gradient(circle at 8% 0%, rgba(240,162,2,.10), transparent 45%),
                radial-gradient(circle at 100% 10%, rgba(12,92,86,.10), transparent 45%),
                var(--bg);
            color:var(--ink);
            padding:28px 16px 60px;
            line-height:1.45;
        }

        .container{
            max-width:1080px;
            margin:0 auto;
        }

        /* ---------- Cabeçalho ---------- */
        .topo{
            text-align:center;
            margin-bottom:28px;
        }
        .eyebrow{
            display:inline-flex;
            align-items:center;
            gap:8px;
            font-family:"Inter",sans-serif;
            font-weight:600;
            font-size:12px;
            letter-spacing:.14em;
            text-transform:uppercase;
            color:var(--teal);
            background:#fff;
            border:1px solid var(--line);
            border-radius:999px;
            padding:6px 14px;
            margin-bottom:14px;
        }
        .eyebrow::before{
            content:"";
            width:8px;height:8px;
            border-radius:50%;
            background:var(--mustard);
        }
        h1{
            font-family:"Bricolage Grotesque",sans-serif;
            font-weight:800;
            font-size:clamp(30px,5vw,46px);
            color:var(--teal-dark);
            letter-spacing:-.01em;
        }
        .subtitulo{
            color:var(--subtle);
            font-size:15px;
            margin-top:8px;
        }

        /* ---------- Filtros ---------- */
        .busca-container{
            display:flex;
            flex-wrap:wrap;
            gap:14px;
            align-items:flex-end;
            background:#fff;
            padding:18px;
            border-radius:14px;
            border:1px solid var(--line);
            box-shadow:var(--shadow);
            margin:26px 0 36px;
        }
        .busca-container label{
            display:flex;
            flex-direction:column;
            gap:6px;
            font-weight:600;
            font-size:13px;
            color:var(--teal-dark);
            flex:1;
            min-width:150px;
        }
        .busca-container input[type="text"],
        .busca-container select,
        .busca-container input[type="date"]{
            padding:10px 12px;
            border:1.5px solid var(--line);
            border-radius:8px;
            font-size:15px;
            font-family:inherit;
            background:var(--bg);
            color:var(--ink);
            transition:border-color .15s;
        }
        .busca-container input:focus,
        .busca-container select:focus{
            outline:none;
            border-color:var(--teal);
        }
        .btn-limpar{
            border:1.5px solid var(--line);
            background:#fff;
            color:var(--terracotta);
            font-weight:700;
            font-size:13px;
            padding:10px 16px;
            border-radius:8px;
            cursor:pointer;
            white-space:nowrap;
            transition:background .15s, border-color .15s;
        }
        .btn-limpar:hover{
            background:#FFF3EC;
            border-color:var(--terracotta);
        }

        /* ---------- Seções ---------- */
        .secao{margin-bottom:44px;}
        .titulo-secao{
            display:flex;
            align-items:center;
            gap:12px;
            font-family:"Bricolage Grotesque",sans-serif;
            color:var(--teal-dark);
            font-size:22px;
            font-weight:700;
            margin-bottom:6px;
        }
        .titulo-secao::after{
            content:"";
            flex:1;
            height:2px;
            background:repeating-linear-gradient(90deg,var(--mustard) 0 8px, transparent 8px 14px);
            border-radius:2px;
        }

        .mes-secao{margin-top:26px;}
        .titulo-mes{
            color:var(--teal);
            font-size:16px;
            font-weight:700;
            text-transform:capitalize;
            margin:0 0 12px;
            padding-left:2px;
            border-left:4px solid var(--mustard);
            padding-left:10px;
        }

        /* ---------- Grade de cards ---------- */
        .grid-flyers{
            display:grid;
            grid-template-columns:1fr;
            gap:20px;
            margin-top:15px;
        }
        @media(min-width:600px){
            .grid-flyers{grid-template-columns:repeat(2,1fr);}
        }
        @media(min-width:900px){
            .grid-flyers{grid-template-columns:repeat(3,1fr);}
        }

        .card{
            background:var(--card-bg);
            border-radius:14px;
            padding:14px;
            border:1px solid var(--line);
            box-shadow:var(--shadow);
            text-align:left;
            display:flex;
            flex-direction:column;
            cursor:pointer;
            transition:transform .18s ease, box-shadow .18s ease;
            position:relative;
            overflow:hidden;
        }
        .card:hover{
            transform:translateY(-4px);
            box-shadow:var(--shadow-hover);
        }
        .card-imagem-wrap{
            position:relative;
            margin-bottom:12px;
        }
        .card img{
            max-width:100%;
            width:100%;
            border-radius:10px;
            height:300px;
            object-fit:cover;
            background:var(--bg-alt);
            display:block;
        }
        .data-badge{
            position:absolute;
            top:10px;
            left:10px;
            background:var(--teal-dark);
            color:#fff;
            font-size:12px;
            font-weight:700;
            padding:5px 10px;
            border-radius:999px;
            letter-spacing:.03em;
            box-shadow:0 2px 6px rgba(0,0,0,.25);
        }
        .nome-evento{
            font-family:"Bricolage Grotesque",sans-serif;
            font-weight:700;
            font-size:17px;
            margin:0 0 4px;
            color:var(--ink);
        }
        .data-evento{
            font-weight:600;
            color:var(--subtle);
            font-size:13px;
            margin-bottom:12px;
        }

        .card-acoes{
            display:flex;
            gap:8px;
            margin-top:auto;
        }
        .btn-calendario{
            flex:1;
            background:var(--terracotta);
            color:#fff;
            text-decoration:none;
            padding:9px 0;
            border-radius:8px;
            font-size:13px;
            font-weight:700;
            cursor:pointer;
            transition:background .15s;
            text-align:center;
            border:none;
            font-family:inherit;
        }
        .btn-calendario:hover{
            background:#C24A20;
        }

        /* ---------- Pop‑up de visualização (imagem) ---------- */
        .quickview{
            position:fixed;
            inset:0;
            background:rgba(15,20,17,.6);
            backdrop-filter:blur(2px);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:1000;
            padding:20px;
        }
        .quickview.active{display:flex;}
        .quickview .qv-content{
            background:var(--quickview-bg,#fff);
            border-radius:14px;
            max-width:90vw;
            max-height:90vh;
            width:auto;
            text-align:center;
            box-shadow:0 20px 50px rgba(0,0,0,.35);
            position:relative;
            padding:18px;
        }
        .quickview .qv-content img{
            max-width:100%;
            max-height:78vh;
            border-radius:10px;
            display:block;
            margin:0 auto;
        }
        .quickview .qv-close{
            position:absolute;
            top:8px;
            right:12px;
            font-size:26px;
            font-weight:bold;
            color:#888;
            cursor:pointer;
            line-height:1;
        }
        .quickview .qv-close:hover{color:#000;}

        .qv-titulo{
            font-family:"Bricolage Grotesque",sans-serif;
            font-weight:700;
            font-size:19px;
            color:var(--teal-dark);
            margin:2px 0 4px;
        }
        .qv-sub{
            color:var(--subtle);
            font-size:14px;
            margin-bottom:14px;
        }
        .qv-opcoes{
            display:flex;
            flex-direction:column;
            gap:10px;
        }
        .link-secundario{
            font-size:12px;
            color:var(--subtle);
            text-decoration:underline;
            cursor:pointer;
        }

        /* ---------- Mensagens de estado ---------- */
        .loading, .erro, .vazio{
            text-align:center;
            font-size:16px;
            color:var(--subtle);
            margin:40px 0;
            padding:20px;
            background:#fff;
            border-radius:12px;
            border:1px solid var(--line);
        }
        .erro{color:var(--terracotta); font-weight:600;}
    </style>
</head>

<body>

<div class="container">
    <div class="topo">
        <span class="eyebrow">Roda aberta</span>
        <h1>Mural de Eventos de Capoeira 🤸‍♂️</h1>
        <p class="subtitulo">Rodas, batizados e eventos da comunidade — tudo num só lugar.</p>
    </div>

    <!-- ---------- Filtros ---------- -->
    <div class="busca-container">
        <label>
            Buscar por nome
            <input type="text" id="busca-texto" placeholder="Ex.: batizado, roda..." oninput="aplicarFiltros()">
        </label>
        <label>
            Data exata
            <input type="date" id="calendario" onchange="aplicarFiltros()">
        </label>
        <label>
            Mês
            <select id="filtro-mes" onchange="aplicarFiltros()">
                <option value="">Todos os meses</option>
            </select>
        </label>
        <button class="btn-limpar" onclick="limparFiltros()" type="button">Limpar filtros</button>
    </div>

    <div id="loading" class="loading">Carregando eventos locais…</div>

    <!-- ---------- Próximos eventos ---------- -->
    <div class="secao" id="secao-fds" style="display:none;">
        <h2 class="titulo-secao">Este final de semana</h2>
        <div class="grid-flyers" id="flyers-fds"></div>
    </div>

    <!-- ---------- Outros eventos futuros ---------- -->
    <div class="secao" id="secao-futuros" style="display:none;">
        <h2 class="titulo-secao">Outros eventos futuros</h2>
        <div id="flyers-futuros"></div>
    </div>

    <div id="vazio" class="vazio" style="display:none;">Nenhum evento encontrado para os filtros escolhidos.</div>
</div>

<!-- Pop‑up de visualização de imagem / calendário -->
<div id="quickview" class="quickview" onclick="fecharQuickview()">
    <div class="qv-content" onclick="event.stopPropagation()">
        <span class="qv-close" title="Fechar">&times;</span>
        <img id="qv-img" src="" alt="Visualização maior">
    </div>
</div>

<script>
/* -----------------------------------------------------------------
   CONFIGURAÇÃO E DADOS
----------------------------------------------------------------- */
const URL_CSV = "eventos.csv"; // arquivo CSV local (mesmo diretório)
let todosOsEventos = [];

/* Faz o parse de uma linha de CSV respeitando aspas (permite vírgulas
   dentro de um campo, por exemplo no endereço: "Rua A, 123, Centro"). */
function parseCSVLine(line) {
    const result = [];
    let cur = "";
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
            if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
            else { inQuotes = !inQuotes; }
        } else if (char === "," && !inQuotes) {
            result.push(cur.trim());
            cur = "";
        } else {
            cur += char;
        }
    }
    result.push(cur.trim());
    return result;
}

async function carregarDadosDoCSV() {
    try {
        const resp = await fetch(URL_CSV);
        if (!resp.ok) throw new Error("CSV fetch failed: " + resp.status);
        const txt = await resp.text();

        const rows = txt.split("\n");
        const headerOk = rows[0].includes("Data");
        const dataRows = headerOk ? rows.slice(1) : rows;
        const hoje = new Date();
        hoje.setHours(0,0,0,0);

        dataRows.forEach(r => {
            if (!r.trim()) return;
            const campos = parseCSVLine(r);

            // Suporta o formato novo (Data,Horario,Nome,Endereco,Link)
            // e o formato antigo (Data,Nome,Link), para não quebrar
            // planilhas já existentes.
            let dataStr, horaStr, nome, endereco, link;
            if (campos.length >= 5) {
                [dataStr, horaStr, nome, endereco, link] = campos;
            } else if (campos.length === 4) {
                [dataStr, nome, endereco, link] = campos;
                horaStr = "";
            } else {
                [dataStr, nome, link] = campos;
                horaStr = ""; endereco = "";
            }
            if (!dataStr || !nome || !link) return;

            const [dia, mes, ano] = dataStr.trim().split("/");
            let dataEvento;
            const horaValida = horaStr && /^\d{1,2}:\d{2}$/.test(horaStr.trim());
            if (horaValida) {
                const [hh, mm] = horaStr.trim().split(":");
                dataEvento = new Date(ano, mes - 1, dia, hh, mm);
            } else {
                dataEvento = new Date(ano, mes - 1, dia);
            }
            if (isNaN(dataEvento.getTime()) || dataEvento < hoje) return;

            todosOsEventos.push({
                dataStr: dataStr.trim(),
                horaStr: horaValida ? horaStr.trim() : "",
                dataObjeto: dataEvento,
                nome: nome.trim(),
                endereco: (endereco || "").trim(),
                link: link.trim()
            });
        });

        todosOsEventos.sort((a,b) => a.dataObjeto - b.dataObjeto);
        popularOptionsMes();
        document.getElementById("loading").style.display = "none";

        if (todosOsEventos.length === 0) {
            document.getElementById("vazio").style.display = "block";
            document.getElementById("vazio").innerText = "Nenhum evento futuro encontrado em eventos.csv.";
        }

        aplicarFiltros();
    } catch (e) {
        document.getElementById("loading").style.display = "none";
        const erroEl = document.createElement("div");
        erroEl.className = "erro";
        erroEl.innerText = "Não foi possível carregar eventos.csv. Verifique se o arquivo está na mesma pasta deste HTML e se a página está sendo aberta por um servidor local (não direto do arquivo).";
        document.querySelector(".container").insertBefore(erroEl, document.getElementById("secao-fds"));
        console.error(e);
    }
}

function popularOptionsMes() {
    const sel = document.getElementById("filtro-mes");
    const meses = new Set();

    todosOsEventos.forEach(ev => {
        const yyyy = ev.dataObjeto.getFullYear();
        const mm = String(ev.dataObjeto.getMonth() + 1).padStart(2, "0");
        meses.add(`${yyyy}-${mm}`);
    });

    const arr = Array.from(meses).sort();
    sel.innerHTML = `<option value="">Todos os meses</option>` +
        arr.map(chave => {
            const [ano, mes] = chave.split("-");
            const d = new Date(ano, mes - 1, 1);
            const nomeMes = d.toLocaleString("pt-BR", { month: "long" });
            return `<option value="${chave}">${nomeMes} ${ano}</option>`;
        })
        .join("");
}

/* -----------------------------------------------------------------
   LÓGICA DE FILTRAGEM
----------------------------------------------------------------- */
function aplicarFiltros() {
    const textoBusca = document.getElementById("busca-texto").value.trim().toLowerCase();
    const dataInput = document.getElementById("calendario").value;
    const mesSel = document.getElementById("filtro-mes").value;

    let filtrados = todosOsEventos;

    if (textoBusca) {
        filtrados = filtrados.filter(ev => ev.nome.toLowerCase().includes(textoBusca));
    }

    if (dataInput) {
        const [ano, mes, dia] = dataInput.split("-");
        const dataBuscada = new Date(ano, mes - 1, dia);
        filtrados = filtrados.filter(ev =>
            ev.dataObjeto.getTime() === dataBuscada.getTime()
        );
    }

    if (mesSel) {
        const [ano, mes] = mesSel.split("-");
        const inicio = new Date(ano, mes - 1, 1);
        const fim = new Date(ano, mes - 1, 31, 23, 59, 59, 999);
        filtrados = filtrados.filter(ev =>
            ev.dataObjeto.getTime() >= inicio.getTime() &&
            ev.dataObjeto.getTime() <= fim.getTime()
        );
    }

    renderizarPainel(filtrados);
}

function limparFiltros() {
    document.getElementById("busca-texto").value = "";
    document.getElementById("calendario").value = "";
    document.getElementById("filtro-mes").value = "";
    aplicarFiltros();
}

/* -----------------------------------------------------------------
   RENDERIZAÇÃO
----------------------------------------------------------------- */
function renderizarPainel(eventos) {
    const hoje = new Date();
    hoje.setHours(0,0,0,0);

    const nextSunday = new Date(hoje);
    const dayDiff = (7 - hoje.getDay()) % 7;
    nextSunday.setDate(hoje.getDate() + dayDiff);

    const fdsContainer = document.getElementById("flyers-fds");
    const futurosContainer = document.getElementById("flyers-futuros");

    fdsContainer.innerHTML = "";
    futurosContainer.innerHTML = "";

    let temFds = false;
    const futurosPorMes = {};

    eventos.forEach(ev => {
        const idx = todosOsEventos.indexOf(ev);
        const cardHTML = `
            <div class="card" data-idx="${idx}">
                <div class="card-imagem-wrap">
                    <span class="data-badge">${ev.dataStr}${ev.horaStr ? " · " + ev.horaStr : ""}</span>
                    <img src="${ev.link}" alt="Flyer" onerror="this.src='https://via.placeholder.com/280x320?text=Sem+Imagem'">
                </div>
                <div class="nome-evento">${ev.nome}</div>
                <div class="data-evento">
                    📅 ${ev.dataStr}${ev.horaStr ? `&nbsp;&nbsp;🕒 ${ev.horaStr}` : ""}
                    ${ev.endereco ? `<br>📍 ${ev.endereco}` : ""}
                </div>
                <div class="card-acoes">
                    <button type="button" class="btn-calendario"
                       onclick="event.stopPropagation(); adicionarAoCalendarioDireto(${idx})">
                        Adicionar ao calendário
                    </button>
                </div>
            </div>`;

        if (ev.dataObjeto.getTime() >= hoje.getTime() && ev.dataObjeto.getTime() <= nextSunday.getTime()) {
            fdsContainer.innerHTML += cardHTML;
            temFds = true;
        } else {
            const chaveMes = ev.dataObjeto.getFullYear() + "-" +
                             String(ev.dataObjeto.getMonth() + 1).padStart(2, "0");
            if (!futurosPorMes[chaveMes]) futurosPorMes[chaveMes] = [];
            futurosPorMes[chaveMes].push(cardHTML);
        }
    });

    document.getElementById("secao-fds").style.display = temFds ? "block" : "none";

    if (Object.keys(futurosPorMes).length) {
        Object.keys(futurosPorMes).sort().forEach(chave => {
            const [ano, mes] = chave.split("-");
            const d = new Date(ano, mes - 1, 1);
            const tituloMes = d.toLocaleString("pt-BR", { month: "long", year: "numeric" });

            const div = document.createElement("div");
            div.className = "mes-secao";
            div.innerHTML = `<h3 class="titulo-mes">${tituloMes}</h3><div class="grid-flyers">${futurosPorMes[chave].join("")}</div>`;
            futurosContainer.appendChild(div);
        });
    }
    document.getElementById("secao-futuros").style.display = Object.keys(futurosPorMes).length ? "block" : "none";

    document.getElementById("vazio").style.display = eventos.length === 0 ? "block" : "none";
    if (eventos.length === 0) {
        document.getElementById("vazio").innerText = "Nenhum evento encontrado para os filtros escolhidos.";
    }
}

/* -----------------------------------------------------------------
   POP‑UP DE VISUALIZAÇÃO (imagem maior) – abre no clique do cartão
----------------------------------------------------------------- */
function abrirQuickview(idx) {
    const ev = todosOsEventos[idx];
    if (!ev) return;
    const qv = document.getElementById("quickview");
    qv.innerHTML = `
        <div class="qv-content" onclick="event.stopPropagation()">
            <span class="qv-close" title="Fechar">&times;</span>
            <img src="${ev.link}" alt="Flyer" onerror="this.src='https://via.placeholder.com/280x320?text=Sem+Imagem'">
            <div class="qv-titulo">${ev.nome}</div>
            <div class="qv-sub">
                📅 ${ev.dataStr}${ev.horaStr ? `&nbsp;&nbsp;🕒 ${ev.horaStr}` : ""}
                ${ev.endereco ? `<br>📍 ${ev.endereco}` : ""}
            </div>
        </div>`;
    qv.classList.add("active");
    qv.querySelector(".qv-close").onclick = fecharQuickview;
}
function fecharQuickview() {
    const qv = document.getElementById("quickview");
    qv.classList.remove("active");
    qv.innerHTML = `
        <div class="qv-content" onclick="event.stopPropagation()">
            <span class="qv-close" title="Fechar">&times;</span>
            <img id="qv-img" src="" alt="Visualização maior">
        </div>`;
}

document.addEventListener("click", e => {
    const card = e.target.closest(".card");
    if (card && !e.target.closest(".btn-calendario")) {
        const idx = Number(card.getAttribute("data-idx"));
        abrirQuickview(idx);
    }
    if (e.target.closest(".qv-close")) {
        fecharQuickview();
    }
});

document.addEventListener("keydown", e => {
    if (e.key === "Escape") fecharQuickview();
});

/* -----------------------------------------------------------------
   ADICIONAR AO CALENDÁRIO – abre direto o app nativo do aparelho
----------------------------------------------------------------- */
function detectarPlataforma() {
    const ua = navigator.userAgent || navigator.vendor || "";
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const isAndroid = /Android/.test(ua);
    return isIOS ? "ios" : (isAndroid ? "android" : "desktop");
}

/* Escapa vírgulas, ponto‑e‑vírgula e quebras de linha conforme o
   formato .ics exige para SUMMARY/LOCATION/DESCRIPTION. */
function escaparICS(txt) {
    return String(txt || "")
        .replace(/\\/g, "\\\\")
        .replace(/,/g, "\\,")
        .replace(/;/g, "\\;")
        .replace(/\n/g, "\\n");
}

function montarICS(ev) {
    const [dia, mes, ano] = ev.dataStr.split("/");
    const dataBase = `${ano}${mes.padStart(2,"0")}${dia.padStart(2,"0")}`;

    const linhas = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Mural de Capoeira//Evento Único//PT",
        "CALSCALE:GREGORIAN",
        "BEGIN:VEVENT",
        `UID:${Date.now()}@muralcapoeira.com`
    ];

    if (ev.horaStr) {
        // Evento com horário definido: duração padrão de 2 horas.
        const [hh, mm] = ev.horaStr.split(":");
        const mmP = mm.padStart(2, "0");
        const inicio = `${dataBase}T${hh.padStart(2,"0")}${mmP}00`;
        const horaFim = (parseInt(hh, 10) + 2) % 24;
        const fim = `${dataBase}T${String(horaFim).padStart(2,"0")}${mmP}00`;
        linhas.push(`DTSTART:${inicio}`, `DTEND:${fim}`);
    } else {
        // Sem horário: evento de dia inteiro.
        linhas.push(`DTSTART;VALUE=DATE:${dataBase}`, `DTEND;VALUE=DATE:${dataBase}`);
    }

    linhas.push(`SUMMARY:${escaparICS(ev.nome)}`);
    if (ev.endereco) linhas.push(`LOCATION:${escaparICS(ev.endereco)}`);
    linhas.push("DESCRIPTION:Evento do Mural de Capoeira", "END:VEVENT", "END:VCALENDAR");

    return linhas.join("\r\n");
}

/* Abre diretamente o app de calendário do aparelho, sem passar por um
   menu no navegador. iOS/Android reconhecem o tipo text/calendar e
   entregam o evento direto para o app nativo; no desktop, o arquivo
   .ics baixado abre no app de calendário padrão do sistema. */
function adicionarAoCalendarioDireto(idx) {
    const ev = todosOsEventos[idx];
    if (!ev) return;

    const plataforma = detectarPlataforma();
    const icsContent = montarICS(ev);

    if (plataforma === "ios") {
        // Data URI: o Safari do iOS reconhece text/calendar e abre o
        // app Calendário diretamente, sem passar por uma aba nova.
        window.location.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(icsContent);
        return;
    }

    if (plataforma === "android") {
        // Tenta abrir o app do Google Agenda via intent nativo.
        // Se o app não estiver instalado, cai automaticamente no
        // download do .ics como alternativa.
        const dataUri = "data:text/calendar;charset=utf-8," + encodeURIComponent(icsContent);
        const blob = new Blob([icsContent], {type:"text/calendar;charset=utf-8"});
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = `${ev.nome.replace(/[^a-z0-9]+/gi,"-")}.ics`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
        return;
    }

    // Desktop: baixa o .ics, que abre no app de calendário padrão do sistema.
    const blob = new Blob([icsContent], {type:"text/calendar;charset=utf-8"});
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = `${ev.nome.replace(/[^a-z0-9]+/gi,"-")}.ics`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
}
